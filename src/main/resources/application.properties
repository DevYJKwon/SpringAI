spring.application.name=SpringAI
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-5.5
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-3-5-haiku-latest

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

weather.api.base-url=https://api.open-meteo.com
weather.api.model=jma_seamless
weather.api.daily=weather_code,temperature_2m_max,temperature_2m_min,rain_sum,snowfall_sum
weather.api.hourly=temperature_2m,weather_code,rain,snowfall,wind_speed_10m,apparent_temperature,is_day
weather.api.timezone=auto
